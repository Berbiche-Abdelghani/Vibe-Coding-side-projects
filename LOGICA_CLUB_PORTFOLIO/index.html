<!doctype html>
<html lang="en" data-theme="light">
<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--surface:#f6f4fb;--border:#e4e0f0;--text:#17142a;--muted:#5b5670;--primary:#6d28d9;--accent:#06b6d4;--sans:"Space Grotesk",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#0b0918;--surface:#151228;--border:#2a2545;--text:#f1eefb;--muted:#a9a3c4;--primary:#a78bfa;--accent:#22d3ee}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--text);font:400 16px/1.6 var(--sans);transition:background .6s,color .6s}
html.lock{overflow:hidden}
body{margin:0;max-width:100%;overflow-x:hidden}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#vg{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .8s;background:radial-gradient(ellipse at center,transparent 50%,rgba(3,2,10,.55) 100%)}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#name{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,780px);height:30vh;background:none;border:0;cursor:pointer;border-radius:16px}
#hint{position:fixed;left:50%;top:calc(50% + min(16vh,120px));transform:translateX(-50%);font:400 14px/20px var(--mono);color:var(--muted);pointer-events:none;transition:opacity .4s;white-space:nowrap}

#hint::after{content:"_";animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
#fl{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
#bar{position:fixed;left:0;top:0;width:2px;height:100%;background:linear-gradient(var(--accent),var(--primary));transform-origin:top;transform:scaleY(0)}
#sp{height:600vh}
#panel{position:fixed;top:50%;width:min(420px,40vw);padding:24px;background:color-mix(in srgb,var(--surface) 78%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:16px;opacity:0;transform:translateY(calc(-50% + 16px));transition:opacity .3s,transform .3s;pointer-events:none}
#panel.on{opacity:1;transform:translateY(-50%)}

#panel h2,.card h2{margin:8px 0;font-size:28px;line-height:34px}

#links{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,90vw);text-align:center;opacity:0;pointer-events:none;transition:opacity .4s}
#links.on{opacity:1;pointer-events:auto}

.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.pill{display:inline-flex;align-items:center;min-height:44px;padding:0 24px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);text-decoration:none;font-weight:500;transition:border-color .12s,color .12s,box-shadow .2s}

#flat{display:none}
body.flat #c,body.flat #vg,body.flat #hint,body.flat #name,body.flat #panel,body.flat #bar,body.flat #sp,body.flat #links,body.flat .skip{display:none}
body.flat #flat{display:block;max-width:640px;margin:0 auto;padding:64px 24px 96px}
#flat h1{font-size:clamp(64px,18vw,112px);line-height:1;margin:0 0 8px;color:var(--primary)}
.card{margin-top:24px;padding:24px;background:var(--surface);border:1px solid var(--border);border-radius:16px}
#flat .row{justify-content:flex-start;margin-top:32px}
@media(max-width:800px){#panel.l,#panel.r{left:16px;right:16px;width:auto;top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(16px)}#panel.on{transform:none}#links h2{font-size:28px;line-height:34px}}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}

/* easter eggs (additive) */
#egg{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translate(-50%,-12px);z-index:8;max-width:min(92vw,520px);padding:12px 18px;border-radius:12px;border:1px solid var(--primary);background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--text);font:500 13px/20px var(--mono);text-align:center;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;box-shadow:0 8px 32px rgba(167,139,250,.3)}

#egg b{color:var(--primary)}
#eggfx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:7;transition:opacity .8s}

#egg{z-index:9}
#eggbtn{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:6;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:500 14px var(--mono);cursor:pointer}
#eggbtn:hover{border-color:var(--primary)}
#eggbox{position:fixed;left:12px;top:calc(64px + env(safe-area-inset-top,0px));z-index:8;width:min(360px,calc(100vw - 24px));max-height:calc(100vh - 88px);overflow:auto;padding:16px 18px;border-radius:12px;border:1px solid var(--border);background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--text);font:400 13px/20px var(--mono);box-shadow:0 8px 40px rgba(167,139,250,.28)}
#eggbox h3{margin:0 0 8px;font:700 15px/20px var(--sans)}
#eggbox ol{margin:0;padding:0;list-style:none}
#eggbox li{position:relative;padding:6px 0 6px 22px;color:var(--muted);border-top:1px solid var(--border)}

#eggbox li::before{content:"\25E6";position:absolute;left:4px;color:var(--primary)}
#eggbox li.ok::before{content:"\2713";color:var(--accent)}
.eh{margin-top:24px;font:400 12px/16px var(--mono);color:var(--muted)}
#links .pill{transition:border-color .12s,color .12s,box-shadow .2s,opacity .35s,transform .35s,filter .35s}
#links h2,#links p,.eh{transition:opacity .35s,transform .35s,filter .35s}
.out>h2,.out>p,.out>.eh{opacity:0;transform:translateY(-14px);filter:blur(6px)}
.out .pill{opacity:0;transform:scale(.85);filter:blur(4px)}
.out .pill.pick{opacity:1;transform:scale(1.12);filter:none;border-color:var(--accent);color:var(--accent);box-shadow:0 0 36px rgba(34,211,238,.6)}
#go{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0b0918 0%,#4c1d95 55%,#22d3ee 130%);color:#f1eefb;font:500 15px/24px var(--mono);pointer-events:none;clip-path:circle(0 at var(--x,50%) var(--y,50%));transition:clip-path .7s cubic-bezier(.7,0,.2,1)}
#go.on{pointer-events:all;clip-path:circle(150vmax at var(--x,50%) var(--y,50%))}
#go span::after{content:"_";animation:bl 1s steps(1) infinite}
#go::after{content:"";position:absolute;left:0;top:0;height:3px;width:100%;background:#22d3ee;transform:scaleX(0);transform-origin:left;transition:transform .9s .2s}
#go.on::after{transform:scaleX(1)}
</style>

<script>

const L=[
 ["L","Logic","We train our minds to think like a machine , LOGICALLY"],
 ["O","Optimization","Faster , Leaner , Cleaner , We optimize our code and our minds."],
 ["G","Growth","Today's mistakes are tomorrow's lessons , We grow together."],
 ["I","Innovation","We turn curiosity into creativity , We innovate."],
 ["C","Cyber security","The art of protecting systems , We secure the future."],
 ["A","Artificial intelligence" ,"Machines that learn , Minds that lead"]
];
const $=s=>document.querySelector(s),html=document.documentElement;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),lerp=(a,b,t)=>a+(b-a)*t;
const eIn=t=>t*t*t,eOut=t=>1-Math.pow(1-t,3),eIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const sm=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)};
let dead=false;

function flat(){
  dead=true;document.body.classList.add('flat');html.classList.remove('lock');html.dataset.theme='light';
  $('#flat').innerHTML='<h1>LOGICA</h1><p>A scientific club themed around cybersecurity and computer science.</p>'+
   L.map((l,i)=>`<section class="card"><div class="tag">${l[0]} · 0${i+1}</div><h2>${l[1]}</h2><p>${l[2]}</p></section>`).join('')+
   '<h2 style="margin-top:48px">Find us</h2><div class="row">'+$('#lrow').innerHTML+'</div>';
}
$('#plain').onclick=flat;

let R=null;
try{R=new THREE.WebGLRenderer({canvas:$('#c'),antialias:true})}catch(e){}
if(!R||matchMedia('(prefers-reduced-motion: reduce)').matches){flat()}
else{
  html.classList.add('lock');
  (async()=>{try{await Promise.race([document.fonts.load('700 100px "Space Grotesk"'),new Promise(r=>setTimeout(r,1500))])}catch(e){}start()})();
}

function start(){
  const V3=THREE.Vector3,C=THREE.Color,TAU=Math.PI*2;
  R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.toneMapping=THREE.ACESFilmicToneMapping;R.outputEncoding=THREE.sRGBEncoding;
  R.setPixelRatio(Math.min(devicePixelRatio,2));
  const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(50,1,.1,200);
  const cL=new C('#ffffff'),cD=new C('#0b0918'),pL=new C('#6d28d9').convertSRGBToLinear(),pD=new C('#a78bfa').convertSRGBToLinear(),AC=new C(0x22d3ee).convertSRGBToLinear(),bg=new C(),WH=new C(1,1,1);
  const FS=1.35,LH=1.43;
  const mob=()=>innerWidth<=800,asp=()=>innerWidth/innerHeight,sc0=()=>Math.min(1,asp()*8.4*.88/11.4);
  const Ys=[0,1,2,3,4,5,6].map(i=>-9*(i+1)),tx=i=>mob()?0:(i%2?1:-1)*Math.min(3.2,asp()*4.2-2.4);
  let st='idle',t0=0,start0=[],last=0,dim=0,sw=0,shake=0,rs=0,cy=0,segs=[];
  const heat=L.map(()=>0),act=L.map(()=>0),P=L.map(()=>null),po=L.map(()=>0),pv=L.map(()=>0),shk={x:0,y:0},hit={x:0,y:0},mo={x:0,y:0,tx:0,ty:0};
  addEventListener('pointermove',e=>{mo.tx=e.clientX/innerWidth*2-1;mo.ty=e.clientY/innerHeight*2-1});

  // sprite for soft glowing particles
  const sprite=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'#fff');g.addColorStop(.35,'rgba(255,255,255,.35)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)})();

  // procedural studio environment -> real reflections on the letters
  const gc=document.createElement('canvas');gc.width=2;gc.height=256;
  const gx=gc.getContext('2d'),gr=gx.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#fff');gr.addColorStop(.5,'#b9aee0');gr.addColorStop(1,'#2a2150');gx.fillStyle=gr;gx.fillRect(0,0,2,256);
  const gtex=new THREE.CanvasTexture(gc),es=new THREE.Scene();
  es.add(new THREE.Mesh(new THREE.SphereGeometry(40,32,16),new THREE.MeshBasicMaterial({map:gtex,side:THREE.BackSide})));
  [[0,14,6,12,2,8],[-16,3,4,2,10,6],[16,3,-4,2,10,6]].forEach(([x,y,z,w,h,d])=>{const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshBasicMaterial({color:new C(5,5,5.5)}));b.position.set(x,y,z);es.add(b)});
  sc.environment=new THREE.PMREMGenerator(R).fromScene(es,.03).texture;

  // lights
  const hemi=new THREE.HemisphereLight(0xffffff,0x9d8fd0,.5);
  const key=new THREE.DirectionalLight(0xffffff,1.6);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.bias=-.0004;key.shadow.normalBias=.02;key.shadow.radius=4;
  Object.assign(key.shadow.camera,{left:-9,right:9,top:9,bottom:-9,near:1,far:40});
  const rim=new THREE.PointLight(0x22d3ee,0,30),zap=new THREE.PointLight(0xcfeeff,0,40),spot=new THREE.SpotLight(0xd8ccff,0,26,.45,.9,1);
  zap.position.set(0,1.5,5);sc.add(hemi,key,key.target,rim,zap,spot,spot.target);
  const cone=new THREE.Mesh(new THREE.CylinderGeometry(.05,1.9,9,32,1,true),new THREE.MeshBasicMaterial({color:0xa78bfa,transparent:true,opacity:0,alphaMap:gtex,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,toneMapped:false}));sc.add(cone);

  // floor of the white room: glossy, soft radial fade, receives real shadows
  const rc=document.createElement('canvas');rc.width=rc.height=128;
  const rx=rc.getContext('2d'),rg=rx.createRadialGradient(64,64,0,64,64,64);rg.addColorStop(0,'#fff');rg.addColorStop(.5,'#fff');rg.addColorStop(1,'#000');rx.fillStyle=rg;rx.fillRect(0,0,128,128);
  const floor=new THREE.Mesh(new THREE.CircleGeometry(36,64),new THREE.MeshStandardMaterial({color:0xf3f0fb,roughness:.28,transparent:true,alphaMap:new THREE.CanvasTexture(rc),envMapIntensity:.6}));
  floor.rotation.x=-Math.PI/2;floor.position.y=-2.3;floor.receiveShadow=true;sc.add(floor);
  const grid=new THREE.GridHelper(60,48,0xd9d3ee,0xe4e0f0);grid.position.y=-2.29;grid.material.transparent=true;sc.add(grid);

  // real extruded, bevelled letters
  const E={depth:.55,bevelEnabled:true,bevelThickness:.07,bevelSize:.06,bevelSegments:4,curveSegments:40};
  const poly=a=>{const s=new THREE.Shape();for(let i=0;i<a.length;i+=2)i?s.lineTo(a[i],a[i+1]):s.moveTo(a[i],a[i+1]);return s};
  const GL={
   L:()=>[poly([-.65,-1,.65,-1,.65,-.6,-.25,-.6,-.25,1,-.65,1])],
   O:()=>{const s=new THREE.Shape(),h=new THREE.Path();s.absellipse(0,0,.9,1,0,TAU,false);h.absellipse(0,0,.5,.62,0,TAU,true);s.holes.push(h);return[s]},
   G:()=>{const s=new THREE.Shape();s.absellipse(0,0,.9,1,.72,TAU,false);s.absellipse(0,0,.5,.62,TAU,.72,true);return[s,poly([0,0,.9,0,.9,.38,0,.38])]},
   I:()=>[poly([-.2,-1,.2,-1,.2,1,-.2,1])],
   C:()=>{const s=new THREE.Shape();s.absellipse(0,0,.9,1,.6,TAU-.6,false);s.absellipse(0,0,.5,.62,TAU-.6,.6,true);return[s]},
   A:()=>[poly([-.95,-1,-.53,-1,.21,1,-.21,1]),poly([.95,-1,.53,-1,-.21,1,.21,1]),poly([-.5,-.5,.5,-.5,.5,-.18,-.5,-.18])]
  };
  const letters=L.map(l=>{
    const g=new THREE.Group(),M=new THREE.MeshPhysicalMaterial({color:pL.clone(),metalness:.3,roughness:.26,clearcoat:1,clearcoatRoughness:.1});
    GL[l[0]]().forEach(s=>{const ge=new THREE.ExtrudeGeometry(s,E);ge.translate(0,0,-.275);const m=new THREE.Mesh(ge,M);m.castShadow=m.receiveShadow=true;g.add(m)});
    g.userData.m=M;sc.add(g);return g;
  });
  // metal platforms with a glowing edge, plus an impact shock ring each
  const platM=new THREE.MeshStandardMaterial({color:0x1b1633,metalness:.8,roughness:.3});
  const plats=L.map(()=>{const g=new THREE.Group(),b=new THREE.Mesh(new THREE.BoxGeometry(2.8,.14,1.5),platM);b.castShadow=b.receiveShadow=true;
    const e=new THREE.Mesh(new THREE.BoxGeometry(2.84,.03,1.54),new THREE.MeshBasicMaterial({color:AC.clone(),toneMapped:false}));e.position.y=-.03;g.add(b,e);g.userData.e=e;sc.add(g);return g});
  const sk=L.map(()=>{const r=new THREE.Mesh(new THREE.RingGeometry(.9,1,64),new THREE.MeshBasicMaterial({color:AC,transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false,toneMapped:false}));r.rotation.x=-Math.PI/2;sc.add(r);return{r,t:0}});
  // electro waves behind the name
  const rings=[0,1,2,3].map(()=>{const r=new THREE.Mesh(new THREE.RingGeometry(.98,1,64),new THREE.MeshBasicMaterial({color:AC,transparent:true,side:THREE.DoubleSide,depthWrite:false,toneMapped:false}));r.position.z=-.6;sc.add(r);return r});

  // drifting dust in the void
  const N=600,pa=new Float32Array(N*3);for(let i=0;i<N;i++)pa.set([(Math.random()-.5)*28,-6-Math.random()*66,(Math.random()-.5)*14-3],i*3);
  const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pa,3));
  sc.add(new THREE.Points(pg,new THREE.PointsMaterial({size:.16,map:sprite,color:0x7fe7ff,transparent:true,opacity:.55,blending:THREE.AdditiveBlending,depthWrite:false,toneMapped:false})));

  // sparks
  const SN=320,sp={p:new Float32Array(SN*3),c:new Float32Array(SN*3),v:new Float32Array(SN*3),l:new Float32Array(SN),m:new Float32Array(SN).fill(1)},sg=new THREE.BufferGeometry();
  sg.setAttribute('position',new THREE.BufferAttribute(sp.p,3));sg.setAttribute('color',new THREE.BufferAttribute(sp.c,3));
  const spk=new THREE.Points(sg,new THREE.PointsMaterial({size:.24,map:sprite,vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,toneMapped:false}));spk.frustumCulled=false;sc.add(spk);
  let si=0;
  function burst(x,y,z,n,s,up){for(let k=0;k<n;k++){const i=si++%SN,a=Math.random()*6.283,v=s*(.3+Math.random());sp.p.set([x,y,z],i*3);sp.v.set([Math.cos(a)*v,Math.abs(Math.sin(a))*v*.8+up,(Math.random()-.5)*v*.5],i*3);sp.l[i]=sp.m[i]=.5+Math.random()*.7}}
  function stepSparks(dt){for(let i=0;i<SN;i++){if(sp.l[i]<=0){sp.c.set([0,0,0],i*3);continue}sp.l[i]-=dt;const k=Math.max(sp.l[i],0)/sp.m[i];sp.v[i*3+1]-=14*dt;for(let j=0;j<3;j++)sp.p[i*3+j]+=sp.v[i*3+j]*dt;sp.c.set([.7*k,.95*k,k],i*3)}sg.attributes.position.needsUpdate=sg.attributes.color.needsUpdate=true}

  // lightning (2D overlay)
  const fx=$('#fx'),fc=fx.getContext('2d'),fl=$('#fl');let FW=0,FH=0,DPR=1;
  function fxSize(){DPR=Math.min(devicePixelRatio,2);FW=innerWidth;FH=innerHeight;fx.width=FW*DPR;fx.height=FH*DPR}
  function place(){const s=sc0();letters.forEach((m,i)=>{m.scale.setScalar(s*.9);m.position.set((i-2.5)*1.9*s,0,0)})}

  function jag(x0,y0,x1,y1,d,o){if(d<3){o.push([x1,y1]);return}const mx=(x0+x1)/2+(Math.random()-.5)*d*2,my=(y0+y1)/2+(Math.random()-.5)*d*.5;jag(x0,y0,mx,my,d/2,o);jag(mx,my,x1,y1,d/2,o)}

  // physics: kick, gravity, tumble, then damped bounces that dent the platform

  var found={};try{found=JSON.parse(localStorage.getItem('logicaEggs')||'{}')}catch(_){found={}}
